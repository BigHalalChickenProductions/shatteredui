name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm i --no-frozen-lockfile
      - run: pnpm build
      - run: |
          mkdir -p pkg/ShatteredUI
          cp -r plugin.json main.py package.json defaults dist pkg/ShatteredUI/
          cd pkg && zip -r ../ShatteredUI-install.zip ShatteredUI
      - uses: actions/upload-artifact@v4
        with:
          name: ShatteredUI-install
          path: ShatteredUI-install.zip
